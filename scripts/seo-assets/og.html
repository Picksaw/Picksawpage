  #og { width: 1200px; height: 630px; padding: 72px 80px; color: #eaf6ff;
        display: flex; flex-direction: column; justify-content: center; }
  #og::before { content: ""; position: absolute; inset: 0;

  #og::after { content: ""; position: absolute; inset: 0; opacity: .5;
    background-image:
      linear-gradient(rgba(79,216,255,.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,216,255,.05) 1px, transparent 1px);
    background-size: 46px 46px; }
  #og > * { position: relative; }
  .toprow { display: flex; align-items: flex-start; justify-content: space-between; }
  .mark { width: 132px; height: 132px; margin-bottom: 34px; }
  .bolt { width: 56px; height: 56px; margin-top: 10px;
          filter: drop-shadow(0 0 22px rgba(79,216,255,.8)); }
  .word { font-size: 118px; font-weight: 800; letter-spacing: -3px; line-height: 1; }
  .word .cy { background: linear-gradient(92deg,#9fe8ff,#4fd8ff 55%,#2a8fd0);

  .tag { margin-top: 26px; font-size: 30px; font-weight: 400; color: #9fb6d4; letter-spacing: .2px;

  .founder { margin-top: 46px; font-size: 24px; color: #6f86a8; letter-spacing: .3px; }
  .founder b { color: #9fe8ff; font-weight: 600; }

  /* ── app/icon tiles ── */
  .tile { position: absolute; width: 512px; height: 512px; left: 0; top: 650px;
          border-radius: 112px; overflow: hidden;
